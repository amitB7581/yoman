<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff5a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="יומן אימונים">
<title>יומן אימונים</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* Layout: phone-first training log — content column above a fixed bottom tab bar; rest timer docks above the tabs */
:root{
  --bg:#f2f4f7; --paper:#ffffff; --ink:#141a22; --muted:#677487; --line:#dde3ea;
  --accent:#ff5a1f; --accent-ink:#ffffff; --accent-soft:#ffeadf;
  --good:#1a9a52; --good-soft:#dcf5e6; --warn:#c93a2b;
  --n-y:#fff2a8; --n-p:#ffd3e4; --n-g:#cdf2d6; --n-b:#cfe6ff; --n-o:#ffdcbc;
  --display:"Rubik","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --tabh:62px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1116; --paper:#171c24; --ink:#eef1f5; --muted:#95a1b1; --line:#262f3c;
  --accent:#ff7440; --accent-ink:#1a0d06; --accent-soft:#3a2216;
  --good:#4cc584; --good-soft:#173324; --warn:#ff7b6b;
  --n-y:#4a4318; --n-p:#4a2235; --n-g:#1d3d27; --n-b:#1d3350; --n-o:#4a2f17; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 96px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
img{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-family:var(--display);font-weight:800;font-size:1.55rem;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.sync{font-size:.76rem;color:var(--muted)}
h2{font-family:var(--display);font-weight:700;font-size:1.18rem;margin:0}
h3{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:0}
#view{display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.small{font-size:.82rem;color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 13px;font-size:.9rem;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--ink);color:var(--paper);text-decoration:none;text-align:center}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.f{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;min-width:0}
textarea.f{resize:vertical;min-height:96px;line-height:1.6}
.iconbtn{border:0;background:none;color:var(--muted);font-size:1.15rem;padding:4px 8px;border-radius:8px;line-height:1}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:2px 0;align-self:flex-start}
.empty{border:1px dashed var(--line);border-radius:16px;padding:20px;text-align:center;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:.74rem;color:var(--muted);line-height:1.25}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.74rem;color:var(--muted)}
.week i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.85rem}
.week i.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.week i.today{border-color:var(--accent)}

.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.wcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:start;display:flex;flex-direction:column;gap:6px;min-width:0}
.wcard .em{font-size:1.6rem;line-height:1}
.wcard b{font-family:var(--display);font-weight:700;font-size:1rem;line-height:1.3}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);align-items:center}
.tag{background:var(--bg);border-radius:999px;padding:1px 8px;font-size:.75rem;color:var(--muted)}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;text-align:start;width:100%}
.banner b{font-family:var(--display);font-size:1.05rem;display:block}

.exl{display:flex;flex-direction:column}
.exi{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.exi:last-child{border-bottom:0}
.exi .n{font-weight:600;min-width:0}
.exi .t{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;font-size:.9rem}
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;text-align:start;width:100%}
.hrow b{display:block;font-weight:700}

.sx{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sx-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sx-h h3{min-width:0}
.sets{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 46px;gap:6px;align-items:center}
.sets .hd{font-size:.72rem;color:var(--muted);text-align:center}
.sets .no{text-align:center;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.sets input{width:100%;text-align:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 4px;font-variant-numeric:tabular-nums;min-width:0}
.sets input.dn{background:var(--good-soft);border-color:transparent}
.ok{width:46px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--paper);font-weight:800;color:var(--muted)}
.ok[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.sumgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.timerbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:10px;z-index:20}
.timerbar b{font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums;min-width:3.2em}
.timerbar .prog{flex:1;height:6px;border-radius:3px;background:rgba(127,127,127,.35);overflow:hidden}
.timerbar .prog i{display:block;height:100%;background:var(--accent)}
.timerbar button{border:0;border-radius:10px;padding:6px 10px;background:rgba(127,127,127,.28);color:inherit;font-weight:700}

nav.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px));z-index:30}
nav.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tabh);color:var(--muted);font-size:.74rem;font-weight:700}
nav.tabbar .i{font-size:1.3rem;line-height:1;filter:grayscale(1);opacity:.7}
nav.tabbar button[aria-selected="true"]{color:var(--accent)}
nav.tabbar button[aria-selected="true"] .i{filter:none;opacity:1}

.ai{background:var(--accent-soft);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ai label{font-weight:700}
.ai textarea{min-height:70px}

.gwrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px}
table.g{border-collapse:collapse;min-width:100%}
table.g th,table.g td{border:1px solid var(--line);padding:0;min-width:92px;vertical-align:middle}
table.g th{background:var(--bg)}
table.g input{width:100%;border:0;background:transparent;padding:8px;min-width:0}
table.g th input{font-weight:700}
table.g .first{min-width:84px;background:var(--bg)}
table.g .first input{font-weight:600}
table.g .rowdel{min-width:32px;width:32px;border:0;background:var(--paper);text-align:center}
td.chkcell{text-align:center}
.chk{width:100%;min-height:38px;border:0;background:transparent;font-size:1.15rem;font-weight:800;color:var(--good)}
.chk[aria-pressed="false"]::after{content:'';display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-radius:5px;vertical-align:middle}
.thc{display:flex;align-items:center}
.tname{display:flex;gap:8px;align-items:center}

.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.note{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:6px;min-height:110px;min-width:0;overflow:hidden}
.note b{font-weight:700;overflow-wrap:anywhere}
.note .pv{font-size:.85rem;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.c-y{background:var(--n-y);border-color:transparent}.c-p{background:var(--n-p);border-color:transparent}.c-g{background:var(--n-g);border-color:transparent}
.c-b{background:var(--n-b);border-color:transparent}.c-o{background:var(--n-o);border-color:transparent}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.items li{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line)}
.items li input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
.items .tx{flex:1;min-width:0;border:0;background:transparent;padding:6px 0}
.items li.done .tx{text-decoration:line-through;color:var(--muted)}
.items input[type=date]{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:3px 4px;font-size:.78rem;max-width:8.5em}
.items input[type=date].late{border-color:var(--warn);color:var(--warn)}
.star{border:0;background:none;font-size:1.1rem;padding:2px;color:var(--muted);line-height:1}
.star[aria-pressed="true"]{color:var(--accent)}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--paper)}
.dot[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper) inset}
.dot.c-y{background:#ffd84d}.dot.c-p{background:#ff8fbd}.dot.c-g{background:#5fd283}.dot.c-b{background:#6fb2ff}.dot.c-o{background:#ffa25c}
.title-in{font-family:var(--display);font-weight:700;font-size:1.3rem;border:0;background:transparent;padding:4px 0;width:100%;min-width:0;border-bottom:2px solid var(--line)}
.ed{display:flex;flex-direction:column;gap:12px;border-radius:16px;padding:14px;border:1px solid var(--line);background:var(--paper)}

.bex{display:grid;grid-template-columns:minmax(0,1fr) 56px 64px 64px auto;gap:6px;align-items:center}
.bex input,.bex select{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 6px;min-width:0;text-align:center}
.bex input.nm{text-align:start}
.bex-h{font-size:.72rem;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 74px);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:.9rem;z-index:40;max-width:90vw;text-align:center}
@media (max-width:400px){.bex{grid-template-columns:minmax(0,1fr) 48px 56px 56px auto}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><h1>יומן <span>אימונים</span></h1><div class="sync" id="sync">נשמר במכשיר הזה</div></div>
  </header>
  <main id="view"></main>
</div>
<div class="timerbar" id="timerbar" hidden></div>
<div class="toast" id="toast" hidden></div>
<nav class="tabbar" role="tablist">
  <button role="tab" data-tab="train"><span class="i">🏋️</span>אימונים</button>
  <button role="tab" data-tab="tables"><span class="i">📊</span>טבלאות</button>
  <button role="tab" data-tab="notes"><span class="i">📝</span>פתקים</button>
  <button role="tab" data-tab="settings"><span class="i">⚙️</span>הגדרות</button>
</nav>

<script>
/* ================= עזרים ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayKey=()=>keyOf(new Date());
const fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const HE_M=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const HE_D=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const HE_DS=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const fmtDay=k=>{const d=fromKey(k);return 'יום '+HE_D[d.getDay()]+', '+d.getDate()+' ב'+HE_M[d.getMonth()]};
const fmtMin=ms=>{const m=Math.max(1,Math.round(ms/60000));return m<60?m+' דק׳':Math.floor(m/60)+':'+pad(m%60)+' שע׳'};
const clock=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+pad(s%60)};
function toast(t){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ================= ספריית אימונים ================= */
const EQ={db:'משקולות',bw:'משקל גוף',bar:'מתח ומקבילים',mc:'מכונה'};
const EQI={db:'🏋️',bw:'🤸',bar:'🪜',mc:'⚙️'};
const FOCUS={upper:'פלג עליון',legs:'רגליים',full:'כל הגוף',core:'בטן',skills:'קליסטניקס',cardio:'קרדיו',mobility:'גמישות'};
const LEVELS=['מתחיל','בינוני','מתקדם'];
// [שם, ציוד, סטים, חזרות, מנוחה בשניות]
const LIB=[
 {id:'lib-push',em:'💪',focus:'upper',name:'דחיפה: חזה, כתפיים ויד אחורית',desc:'אימון לחיצות עם משקולות ומקבילים.',ex:[
  ['לחיצת חזה במשקולות','db',4,'8-10',90],['לחיצת חזה בשיפוע חיובי','db',3,'10',90],['לחיצת כתפיים בישיבה','db',3,'10',90],
  ['הרחקה לצדדים','db',3,'12-15',60],['מקבילים','bar',3,'מקס׳',90],['פשיטת מרפקים מעל הראש','db',3,'12',60]]},
 {id:'lib-pull',em:'🦍',focus:'upper',name:'משיכה: גב ויד קדמית',desc:'מתח, חתירות ועבודת זרועות.',ex:[
  ['מתח','bar',4,'מקס׳',120],['חתירה במשקולת ביד אחת','db',3,'10 לכל צד',75],['הרחקה אחורית בכפיפה','db',3,'15',60],
  ['כפיפת מרפקים','db',3,'10-12',60],['כפיפת פטישים','db',3,'12',60],['הרמת ברכיים בתלייה','bar',3,'12',60]]},
 {id:'lib-legs',em:'🦵',focus:'legs',name:'רגליים וישבן',desc:'סקוואט, דדליפט ועבודה על רגל אחת.',ex:[
  ['סקוואט גביע','db',4,'12',90],['דדליפט רומני','db',4,'10',90],['לאנג׳ים בהליכה','db',3,'10 לכל רגל',75],
  ['סקוואט בולגרי','db',3,'8 לכל רגל',75],['גשר ישבן','bw',3,'15',60],['הרמות עקבים','db',4,'15',45]]},
 {id:'lib-full',em:'🔥',focus:'full',name:'כל הגוף במשקולות',desc:'אימון אחד שעובד על הכול, טוב ל־3 פעמים בשבוע.',ex:[
  ['טראסטר','db',4,'10',90],['חתירה בכפיפה','db',4,'10',75],['לחיצת חזה במשקולות','db',3,'10',75],
  ['דדליפט רומני','db',3,'10',75],['לאנג׳ים לאחור','db',3,'10 לכל רגל',60],['פלאנק','bw',3,'40 שנ׳',45]]},
 {id:'lib-home-bw',em:'🏠',focus:'upper',name:'פלג עליון בלי ציוד',desc:'רק משקל גוף, אפשר בכל מקום.',ex:[
  ['שכיבות סמיכה','bw',4,'מקס׳',75],['שכיבות סמיכה צרות (יהלום)','bw',3,'10',60],['פייק שכיבות סמיכה','bw',3,'8-10',75],
  ['דיפס על כיסא','bw',3,'12',60],['סופרמן','bw',3,'15',45],['פלאנק','bw',3,'45 שנ׳',45]]},
 {id:'lib-bw-legs',em:'🦿',focus:'legs',name:'רגליים בלי ציוד',desc:'נפח גבוה עם משקל גוף.',ex:[
  ['סקוואט','bw',4,'20',60],['לאנג׳ים לאחור','bw',3,'12 לכל רגל',60],['סקוואט קפיצה','bw',3,'12',75],
  ['גשר ישבן על רגל אחת','bw',3,'12 לכל רגל',45],['ישיבה על הקיר','bw',3,'45 שנ׳',45],['הרמות עקבים','bw',3,'25',45]]},
 {id:'lib-core',em:'🧱',focus:'core',name:'בטן וליבה',desc:'15 דקות שמחזקות את כל המרכז.',ex:[

const sessionsSorted=()=>Object.values(DB.sessions).sort((a,b)=>b.start-a.start);
const weekStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x};
function stats(){
  const ss=sessionsSorted();const now=new Date();const ws=weekStart(now).getTime();
  const thisWeek=ss.filter(s=>s.start>=ws).length;
  const weeks=new Set(ss.map(s=>weekStart(new Date(s.start)).getTime()));
  let streak=0,w=weekStart(now);if(!weeks.has(w.getTime()))w.setDate(w.getDate()-7);
  while(weeks.has(w.getTime())){streak++;w.setDate(w.getDate()-7)}
  return{thisWeek,streak,total:ss.length};
}
function lastFor(name){for(const s of sessionsSorted()){const e=(s.ex||[]).find(x=>x.name===name);if(e&&e.sets&&e.sets.length)return e.sets}return null}
const adjSets=n=>S.set.level===0?Math.max(2,n-1):S.set.level===2?n+1:n;
const estMin=w=>Math.round(w.ex.reduce((a,e)=>a+adjSets(e.sets)*(45+(+e.rest||60)),0)/60);
const eqOf=w=>[...new Set(w.ex.map(e=>e.eq||'bw'))];
const getWorkout=id=>{const l=LIB.find(x=>x.id===id);if(l)return libObj(l);const c=DB.custom[id];return c?{...c,custom:true,em:c.em||'⭐'}:null};
const volume=s=>(s.ex||[]).reduce((a,e)=>a+e.sets.reduce((b,x)=>b+(parseFloat(x.w)||0)*(parseFloat(x.r)||0),0),0);
const setCount=s=>(s.ex||[]).reduce((a,e)=>a+e.sets.length,0);

let AC=null;
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.25,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+.2);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.2)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startRest(sec){S.rest={end:Date.now()+sec*1000,total:sec,done:false};$('timerbar').dataset.mode='';try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}renderTimer()}
function renderTimer(){
  const el=$('timerbar');const r=S.rest;
  if(!r||(r.done&&Date.now()-r.end>4000)){el.hidden=true;el.dataset.mode='';if(r&&r.done)S.rest=null;return}
  el.hidden=false;const left=(r.end-Date.now())/1000;
  if(left<=0&&!r.done){r.done=true;beep()}
  const mode=r.done?'done':'run';
  if(el.dataset.mode===mode&&mode==='run'){el.querySelector('b').textContent=clock(left);el.querySelector('.prog i').style.width=Math.max(0,100-left/r.total*100)+'%';return}
  el.dataset.mode=mode;
  el.innerHTML=r.done?`<b style="min-width:0">💪 יאללה, סט הבא!</b><span class="prog"><i style="width:100%"></i></span><button data-tact="close">סגור</button>`
    :`<span>מנוחה</span><b>${clock(left)}</b><span class="prog"><i style="width:${Math.max(0,100-left/r.total*100)}%"></i></span><button data-tact="plus">+15</button><button data-tact="skip">דלג</button>`;
}
$('timerbar').addEventListener('click',e=>{const b=e.target.closest('[data-tact]');if(!b||!S.rest)return;const a=b.dataset.tact;
  if(a==='plus'){S.rest.end+=15000;S.rest.total+=15}else{S.rest=null}$('timerbar').dataset.mode='';renderTimer()});
setInterval(()=>{if(S.rest)renderTimer();const el=$('elapsed');if(el&&S.active)el.textContent=clock((Date.now()-S.active.start)/1000)},250);

/* ================= AI (Gemini, חינם) ================= */
const GEMINI_MODELS=['gemini-3.8-flash','gemini-flash-latest','gemini-3.6-flash'];
function makeAI(key){
  async function gen(input){
    for(const m of GEMINI_MODELS){
      let r;try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},
        body:JSON.stringify({contents:[{role:'user',parts:[{text:input+'\n\nהחזר JSON תקין בלבד.'}]}],generationConfig:{temperature:.7,maxOutputTokens:4000,responseMimeType:'application/json'}})})}catch(e){throw{code:'network'}}
      if(r.status===404)continue;
      if(r.status===429)throw{code:'rate'};
      if(r.status===400||r.status===401||r.status===403)throw{code:'key'};
      if(!r.ok)throw{code:'error'};
      const j=await r.json();const text=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(x=>x.text||'').join('');
      const mm=text.match(/\{[\s\S]*\}/);if(!mm)throw{code:'json'};return JSON.parse(mm[0]);
    }
    throw{code:'error'};
  }
  return{json:gen};
}
const aiErr=e=>e&&e.code==='key'?'מפתח ה־AI לא תקין. בדוק אותו בהגדרות':e&&e.code==='rate'?'הגעת למכסה החינמית. נסה שוב בעוד דקה, או מחר':e&&e.code==='network'?'אין חיבור לאינטרנט':'לא הצלחתי. נסה לנסח את הבקשה אחרת';
function applyKey(k){S.ai=k?makeAI(k):null}
applyKey(lsGet('ya-key',''));
async function runAIWorkout(){
  const q=(S.aiW||'').trim();if(!q){S.aiWMsg='כתוב קודם איזה אימון אתה רוצה';return render()}
  S.busy='w';S.aiWMsg='';render();
  try{
    const r=await S.ai.json(`אתה מאמן כושר מקצועי. בנה אימון אחד בעברית לפי הבקשה: ${q}
ציוד זמין: משקל גוף${S.set.eq.map(e=>', '+EQ[e]).join('')}. רמת המתאמן: ${LEVELS[S.set.level]}.
החזר JSON בצורה: {"name": string, "focus": "upper"|"legs"|"full"|"core"|"skills"|"cardio"|"mobility", "desc": string, "ex": [{"name": string, "eq": "db"|"bw"|"bar"|"mc", "sets": number, "reps": string, "rest": number}]}
כללים: 4 עד 9 תרגילים. שמות תרגילים קצרים בעברית. reps כמו "10" או "8-12" או "30 שנ׳". rest בשניות. השתמש רק בציוד הזמין. desc במשפט אחד קצר.`);
    if(!r||!Array.isArray(r.ex)||!r.ex.length)throw{code:'json'};
    const w={id:uid(),name:String(r.name||'אימון AI').slice(0,60),em:'✨',focus:FOCUS[r.focus]?r.focus:'full',desc:String(r.desc||'').slice(0,140),created:Date.now(),
      ex:r.ex.slice(0,12).map(x=>({name:String(x.name||'תרגיל').slice(0,60),eq:EQ[x.eq]?x.eq:'bw',sets:Math.max(1,Math.min(8,parseInt(x.sets)||3)),reps:String(x.reps||'10').slice(0,20),rest:Math.max(0,Math.min(300,parseInt(x.rest)||60))}))};
    put('custom',w.id,w);S.aiW='';S.busy=null;S.aiWMsg='';return go({v:'detail',id:w.id});
  }catch(e){S.aiWMsg=aiErr(e)}
  S.busy=null;render();
}
async function runAITable(mode){
  const q=(S.aiT||'').trim();if(!q){S.aiTMsg='כתוב קודם מה אתה רוצה בטבלה';return render()}
  const t=DB.tables[S.curTable];const edit=mode==='edit'&&t;
  S.busy='t';S.aiTMsg='';render();
  try{
    const r=await S.ai.json(`אתה בונה טבלאות מסודרות בעברית בתוך אפליקציית אימונים.
בקשת המשתמש: ${q}
${edit?'הטבלה הנוכחית (JSON): '+JSON.stringify({name:t.name,cols:t.cols,rows:t.rows})+'\nעדכן אותה לפי הבקשה ושמור על מה שכבר מולא.':'צור טבלה חדשה.'}
החזר JSON בצורה {"name": string, "cols": string[], "rows": string[][]}. כל שורה באורך מספר העמודות. עד 8 עמודות ו־40 שורות. תאים קצרים.
עמודה שמסמנים בה V (בוצע, הושג) תכיל ✓ בכותרת ותאים ריקים.`);
    if(!r||!Array.isArray(r.cols)||!Array.isArray(r.rows)||!r.cols.length)throw{code:'json'};
    const cols=r.cols.slice(0,10).map(String);const rows=r.rows.slice(0,60).map(row=>cols.map((_,i)=>row&&row[i]!=null?String(row[i]):''));
    if(edit){Object.assign(t,{name:String(r.name||t.name).slice(0,60),cols,rows});put('tables',t.id,t)}
    else{const n={id:uid(),name:String(r.name||'טבלה').slice(0,60),cols,rows,created:Date.now()};put('tables',n.id,n);S.curTable=n.id}
    S.aiT='';S.aiTMsg=edit?'הטבלה עודכנה ✓':'הטבלה נוצרה ✓';
  }catch(e){S.aiTMsg=aiErr(e)}
  S.busy=null;render();
}
async function runAINote(){
  const q=(S.aiN||'').trim();if(!q){S.aiNMsg='כתוב קודם מה צריך';return render()}
  S.busy='n';S.aiNMsg='';render();
  try{
    const r=await S.ai.json(`סדר את מה שהמשתמש כתב לרשימה מסודרת בעברית: ${q}
החזר JSON בצורה {"title": string, "type": "check"|"todo", "items": string[]}.
type="todo" למשימות לביצוע, type="check" לרשימות כמו קניות או ציוד. פריטים קצרים, בלי כפילויות, בסדר הגיוני (קניות לפי מחלקות בסופר). עד 40 פריטים.`);
    if(!r||!Array.isArray(r.items)||!r.items.length)throw{code:'json'};
    const n=newNote(r.type==='todo'?'todo':'check',{title:String(r.title||'רשימה').slice(0,60),items:r.items.slice(0,60).map(t=>({id:uid(),t:String(t).slice(0,120),d:false,due:'',star:false}))});
    S.aiN='';S.busy=null;S.aiNMsg='';return go({v:'note',id:n.id});
  }catch(e){S.aiNMsg=aiErr(e)}
  S.busy=null;render();
}

/* ================= גיבוי ================= */
function doBackup(){
  const data=JSON.stringify({app:'yoman-train',version:1,exported:new Date().toISOString(),data:DB},null,1);
  const u=URL.createObjectURL(new Blob([data],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='yoman-train-'+todayKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
}
function doRestore(f,input){
  if(!f)return;const fr=new FileReader();
  fr.onload=()=>{try{const b=JSON.parse(fr.result);if(b.app!=='yoman-train'||!b.data)throw 0;let n=0;
    for(const k in DB)for(const id in (b.data[k]||{})){put(k,id,b.data[k][id]);n++}
    toast('שוחזרו '+n+' פריטים ✓');render()}catch(e){toast('הקובץ הזה לא גיבוי של יומן אימונים')}input.value=''};
  fr.readAsText(f);
}

let unsub=null;
async function cloudStart(col){
  setSync('מתחבר לענן…');
  const snap=await col.get();const remote={sessions:{},custom:{},tables:{},notes:{}};let oldTables=null;
  snap.docs.forEach(doc=>{const id=doc.id,k=kindOf(id);
    if(k){try{remote[k][id.slice(2)]=JSON.parse(doc.data().json)}catch(e){}}
    else if(id==='s-tables'){try{oldTables=JSON.parse(doc.data().json)}catch(e){}}});
  COL=col;
  for(const k in DB){
    for(const id in DB[k])if(!remote[k][id])col.doc(PREFIX[k]+id).set({json:JSON.stringify(DB[k][id])}).catch(()=>{});
    DB[k]=Object.assign({},DB[k],remote[k]);
  }
  if(oldTables&&!Object.keys(DB.tables).length)(oldTables||[]).forEach((t,i)=>{const id=uid()+i;put('tables',id,{id,name:t.name||'טבלה',cols:t.cols||[],rows:t.rows||[],created:Date.now()+i})});
  lsSave();setSync('מסונכרן לענן ✓');safeRender();
  unsub=col.onSnapshot(sn=>{let ch=false;
    sn.docChanges().forEach(c=>{if(c.doc.metadata.hasPendingWrites)return;const id=c.doc.id,k=kindOf(id);if(!k)return;const key=id.slice(2);
      if(c.type==='removed'){if(DB[k][key]){delete DB[k][key];ch=true}}
      else{try{const v=JSON.parse(c.doc.data().json);if(JSON.stringify(v)!==JSON.stringify(DB[k][key])){DB[k][key]=v;ch=true}}catch(e){}}});
    if(ch){lsSave();safeRender()}},()=>setSync('אין חיבור לענן כרגע – נשמר במכשיר'));
}
