<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f54d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="סופר יומן">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>סופר יומן</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: planner notebook — month grid on top, the selected day's page below; highlighter markers paint whole days */
:root{
  --bg:#f3f5f7; --paper:#ffffff; --ink:#1d2a3a; --muted:#6a7787; --line:#dde3ea;
  --accent:#2f54d6; --accent-soft:#e6ecff; --holiday:#c2412d; --holiday-soft:#fdeae6;
  --fun:#c4307a; --fun-soft:#fde6f1;
  --mood1:#2fa84f; --mood2:#7cc46b; --mood3:#a5adb8; --mood4:#e8963a; --mood5:#d64a3b;
  --m-y:#ffe86b; --m-p:#ffb3d1; --m-g:#a8ecb5; --m-b:#a9d4ff; --m-o:#ffc78a;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --paper:#1b212b; --ink:#e7ecf3; --muted:#9aa6b5; --line:#2c3542;
  --accent:#8aa6ff; --accent-soft:#25304d; --holiday:#ff8a73; --holiday-soft:#3a2420; --fun:#ff86c0; --fun-soft:#3d2131;
  --m-y:#8a7a1c; --m-p:#8a3a5a; --m-g:#2f6e3c; --m-b:#2c5a8a; --m-o:#8a5420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --paper:#1b212b; --ink:#e7ecf3; --muted:#9aa6b5; --line:#2c3542;
  --accent:#8aa6ff; --accent-soft:#25304d; --holiday:#ff8a73; --holiday-soft:#3a2420; --fun:#ff86c0; --fun-soft:#3d2131;
  --m-y:#8a7a1c; --m-p:#8a3a5a; --m-g:#2f6e3c; --m-b:#2c5a8a; --m-o:#8a5420; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0;letter-spacing:.01em}
.sync{font-size:.8rem;color:var(--muted)}
.nav{display:flex;align-items:center;gap:6px}
.nav h2{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0;min-width:9.5em;text-align:center}
.icon-btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;width:38px;height:38px;font-size:1.1rem}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:.9rem}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:flex;gap:4px}
.markers{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:7px;border:2px solid transparent;transform:rotate(-4deg)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.swatch.erase{background:repeating-linear-gradient(45deg,var(--paper) 0 4px,var(--line) 4px 8px)}
.hint{font-size:.85rem;color:var(--accent);background:var(--accent-soft);padding:6px 10px;border-radius:8px}

.banner{background:var(--accent-soft);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.banner b{font-weight:700}

.cal{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:.78rem;color:var(--muted);letter-spacing:.04em;padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cell{position:relative;min-height:64px;border:0;border-radius:8px;background:transparent;padding:4px 3px;text-align:start;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.cell.out{opacity:.35}
.cell .num{font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums;line-height:1.2}
.cell.today .num{background:var(--accent);color:var(--paper);border-radius:999px;padding:0 6px;align-self:flex-start}
.cell.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cell.sat .num{color:var(--holiday)}
.cell .hol{font-size:.62rem;line-height:1.15;color:var(--holiday);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .ev{font-size:.62rem;line-height:1.15;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .icons{display:flex;gap:3px;font-size:.62rem;color:var(--muted);margin-top:auto;flex-wrap:wrap}
.cell.chag{background:var(--holiday-soft)}
.mk-y{background:var(--m-y)!important}.mk-p{background:var(--m-p)!important}.mk-g{background:var(--m-g)!important}
.mk-b{background:var(--m-b)!important}.mk-o{background:var(--m-o)!important}
.anchor{outline:2px dashed var(--ink);outline-offset:-2px}

.list{display:flex;flex-direction:column;gap:8px}
.drow{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:start;width:100%}
.drow.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.drow .date{font-family:var(--display);font-size:1.5rem;line-height:1;grid-row:span 3;min-width:2.2em;text-align:center}
.drow .date small{display:block;font-family:var(--body);font-size:.75rem;color:var(--muted)}
.drow .line{min-width:0;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .line.h{color:var(--holiday);font-weight:600}
.drow .line.m{color:var(--muted)}

.day{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:18px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.day-head h3{font-family:var(--display);font-weight:400;font-size:1.45rem;margin:0;text-wrap:balance}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.8rem;border-radius:999px;padding:2px 10px;background:var(--holiday-soft);color:var(--holiday);font-weight:600}
section h4{margin:0 0 6px;font-size:.78rem;letter-spacing:.08em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;resize:vertical;min-height:90px;line-height:1.6}
textarea.journal{min-height:140px;background-image:repeating-linear-gradient(transparent 0 calc(1.6em - 1px),var(--line) calc(1.6em - 1px) 1.6em);background-attachment:local;background-position:0 10px}
.add{display:flex;gap:6px}
.add input,.rem input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px}
.add button{border:0;background:var(--ink);color:var(--paper);border-radius:10px;padding:0 14px;font-weight:700}
ul.items{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:4px}
ul.items li{display:flex;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid var(--line)}
ul.items li span{flex:1;min-width:0;overflow-wrap:anywhere}
ul.items li.done span{text-decoration:line-through;color:var(--muted)}
ul.items input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.del{border:0;background:none;color:var(--muted);font-size:1.1rem;padding:0 4px}
.status{font-size:.8rem;font-variant-numeric:tabular-nums}
.rem{display:flex;gap:6px;flex-wrap:wrap}
.rem input[type=time]{flex:0 0 auto;width:auto}
.day-markers{display:flex;gap:6px;align-items:center}
.small{font-size:.8rem;color:var(--muted)}
.cell .hol.fun,.drow .line.h.fun{color:var(--fun)}
.tag.fun{background:var(--fun-soft);color:var(--fun)}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.pane{display:flex;flex-direction:column;gap:14px}
.pane-head{display:flex;flex-direction:column;gap:4px}
.pane-head h3{font-family:var(--display);font-weight:400;font-size:1.45rem;margin:0}
.gwrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px}
table.g{border-collapse:collapse;min-width:100%}
table.g th,table.g td{border:1px solid var(--line);padding:0;min-width:92px;vertical-align:top}
table.g th{background:var(--bg)}
table.g input{width:100%;border:0;background:transparent;padding:8px;min-width:0}
table.g th input{font-weight:700}
table.g .first{min-width:74px;background:var(--bg)}
table.g .first input{font-weight:600;font-variant-numeric:tabular-nums}
table.g .hi{background:var(--accent-soft)}
table.g .rowdel{min-width:32px;width:32px;border:0;background:var(--paper);text-align:center}
.thl{padding:8px;font-weight:700;white-space:nowrap}
.thc{display:flex;align-items:center}
.gbar,.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tname{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tname input{flex:1;min-width:0;font-family:var(--display);font-size:1.3rem;border:0;border-bottom:2px solid var(--line);background:transparent;padding:4px 2px}
.pill.warn{color:var(--holiday);border-color:var(--holiday)}
.ai{background:var(--accent-soft);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.ai label{font-weight:700}
.ai textarea{min-height:72px;background:var(--paper)}
.pill.primary{background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:700}
.pill:disabled{opacity:.5;cursor:wait}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.cell .top{display:flex;justify-content:space-between;align-items:baseline;gap:2px}
.cell .heb{font-size:.6rem;color:var(--muted)}
.moodbar{position:absolute;inset-inline:4px;bottom:2px;height:4px;border-radius:2px}
.mood-1{background:var(--mood1)}.mood-2{background:var(--mood2)}.mood-3{background:var(--mood3)}.mood-4{background:var(--mood4)}.mood-5{background:var(--mood5)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.stat b{font-family:var(--display);font-weight:400;font-size:1.35rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.72rem;color:var(--muted);line-height:1.25}
.search input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:9px 12px}
.results{display:flex;flex-direction:column;gap:6px}
.res{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:start;display:flex;flex-direction:column}
.res b{font-size:.85rem}.res span{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
mark{background:var(--m-y);color:inherit;border-radius:3px;padding:0 2px}
.up{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.upi{flex:0 0 auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:6px 12px;text-align:start;max-width:220px}
.upi b{display:block;font-family:var(--display);font-weight:400;font-size:1.05rem;color:var(--accent)}
.upi span{font-size:.82rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum{white-space:pre-wrap;line-height:1.65}
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:4px 8px;font-size:1.35rem;line-height:1}
.moods button[aria-pressed="true"]{border-color:var(--ink);background:var(--accent-soft)}
.add select{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 6px;max-width:7.5em}
.photo img{border-radius:12px;display:block;max-height:340px;object-fit:cover;width:100%}
.photo .gbar{margin-top:8px}
label.pill{display:inline-block;cursor:pointer}
td.chkcell{text-align:center;vertical-align:middle}
.chk{width:100%;min-height:38px;border:0;background:transparent;font-size:1.15rem;font-weight:700;color:var(--mood1)}
.chk[aria-pressed="false"]::after{content:'';display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-radius:5px;vertical-align:middle}
.foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding-top:8px;border-top:1px solid var(--line)}
@media (max-width:420px){.cell{min-height:56px}.nav h2{min-width:7.5em;font-size:1.1rem}}
@media (prefers-reduced-motion:no-preference){.cell,.swatch{transition:background .15s,transform .15s}.swatch:hover{transform:rotate(0)}}
</style>
</head>
<body>
<div class="app" dir="rtl" lang="he">
  <header>
    <div><h1>סופר יומן</h1><div class="sync" id="sync">טוען…</div></div>
    <div class="nav" id="calNav">
      <button class="icon-btn" id="prev" aria-label="הקודם">›</button>
      <h2 id="title"></h2>
      <button class="icon-btn" id="next" aria-label="הבא">‹</button>
      <button class="pill" id="todayBtn">היום</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="cal">יומן</button>
    <button role="tab" data-tab="tt">מערכת שעות</button>
    <button role="tab" data-tab="tb">טבלאות</button>
  </nav>

  <div class="pane" id="pane-cal">
  <div class="toolbar">
    <div class="seg" role="group" aria-label="תצוגה">
      <button class="pill" data-view="month">חודש</button>
      <button class="pill" data-view="week">שבוע</button>
      <button class="pill" data-view="3">3 ימים</button>
    </div>
    <div class="markers">
      <button class="pill" id="markMode" aria-pressed="false">🖍️ מרקר</button>
      <button class="pill" id="rangeMode" aria-pressed="false" hidden>טווח</button>
      <span id="swatches" class="markers" hidden></span>
      <button class="pill primary" id="sumBtn" hidden>✨ סיכום</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="search"><input id="q" type="search" placeholder="🔍 חיפוש ביומן, במשימות ובאירועים…" autocomplete="off"></div>
  <div class="results" id="results"></div>
  <div id="sumBox"></div>
  <div class="up" id="upcoming"></div>
  <div class="hint" id="hint" hidden></div>

  <div id="banners"></div>
  <div id="calWrap"></div>
  <div class="day" id="day"></div>
  </div>
  <div class="pane" id="pane-tt" hidden></div>
  <div class="pane" id="pane-tb" hidden></div>
  <footer class="foot">
    <button class="pill" id="backupBtn">⬇️ גיבוי היומן</button>
    <label class="pill" for="restore">⬆️ שחזור מגיבוי</label>
    <input type="file" id="restore" accept=".json,application/json" hidden>
    <button class="pill" id="cloudBtn" hidden>☁️ סנכרון בענן</button>
    <button class="pill" id="aiKeyBtn">🔑 הגדרת AI</button>
    <span class="small" id="footMsg"></span>
    <div id="cloudBox" hidden style="width:100%;display:flex;flex-direction:column;gap:6px">
      <span class="small" id="cloudInfo">התחבר כדי שהיומן יישמר בענן ויסתנכרן בין הטלפון למחשב. בפעם הראשונה לחץ "צור חשבון".</span>
      <form id="cloudForm" style="display:flex;flex-direction:column;gap:6px">
        <div class="add"><input id="cEmail" type="email" placeholder="אימייל" autocomplete="username"></div>
        <div class="add"><input id="cPass" type="password" placeholder="סיסמה (לפחות 6 תווים)" autocomplete="current-password"></div>
        <div class="gbar"><button class="pill primary" type="submit" id="cLogin">התחבר</button><button class="pill" type="button" id="cSignup">צור חשבון</button><button class="pill" type="button" id="cReset">שכחתי סיסמה</button></div>
      </form>
      <div class="gbar" id="cloudOut" hidden><button class="pill warn" type="button" id="cLogout">התנתק</button></div>
    </div>
    <div id="aiKeyBox" hidden style="width:100%;display:flex;flex-direction:column;gap:6px">
      <span class="small">כדי להפעיל את עוזר ה־AI בחינם: היכנס ל־aistudio.google.com/apikey עם חשבון גוגל, לחץ Create API key והדבק אותו כאן. המפתח נשמר רק במכשיר הזה.</span>
      <div class="add"><input id="aiKey" type="password" placeholder="AIza…" autocomplete="off"><button id="aiKeySave">שמור</button></div>
    </div>
  </footer>
</div>

<script>
document.documentElement.dir='rtl';document.documentElement.lang='he';
const HE_MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const HE_DOW=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const HE_DOW_FULL=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const MARKERS=[['y','צהוב'],['p','ורוד'],['g','ירוק'],['b','כחול'],['o','כתום']];
// חגים ומועדים (לפי hebcal.com). * = יום חג

const HOL={};HOL_RAW.split('|').forEach(s=>{const k=s.slice(0,10);let t=s.slice(11);const chag=t.startsWith('*');if(chag)t=t.slice(1);(HOL[k]=HOL[k]||[]).push({t,chag});});

const FUN_DATED=[['2026-11-27','בלאק פריידי 🛍️'],['2027-02-07','יום המשפחה 👨‍👩‍👧'],['2027-05-09','יום האם הבינלאומי 💐'],['2027-06-20','יום האב הבינלאומי'],['2027-08-18','ט״ו באב – חג האהבה ❤️'],['2027-11-26','בלאק פריידי 🛍️']];
[2026,2027].forEach(y=>FUN_YEARLY.forEach(([md,t])=>FUN_DATED.push([y+'-'+md,t])));
FUN_DATED.forEach(([k,t])=>{(HOL[k]=HOL[k]||[]).push({t,fun:true})});
if(HOL['2027-08-18'])HOL['2027-08-18']=HOL['2027-08-18'].filter(x=>x.fun);

const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayKey=()=>keyOf(new Date());
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const S={days:{},view:'month',cursor:new Date(),sel:todayKey(),mark:false,range:false,color:'y',anchor:null,col:null};
try{const v=localStorage.getItem('sy-view');if(v)S.view=v}catch(e){}
try{const raw=localStorage.getItem('sy-days');if(raw)S.days=JSON.parse(raw)||{}}catch(e){}

const blank=()=>({journal:'',notes:'',tasks:[],events:[],marker:null,reminder:{time:'',text:''},mood:'',photo:null});
const MOODS=['😄','🙂','😐','😕','😢'];const MOOD_N=['מצוין','טוב','רגיל','לא משהו','קשה'];
const REP_N={weekly:'כל שבוע',monthly:'כל חודש',yearly:'כל שנה'};
const GEM_U=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],GEM_T=['','י','כ','ל','מ','נ','ס','ע','פ','צ'],GEM_H=['','ק','ר','ש','ת','תק','תר','תש','תת','תתק'];
function gem(n){n%=1000;let h=GEM_H[Math.floor(n/100)],r=n%100,t;if(r===15)t='טו';else if(r===16)t='טז';else t=GEM_T[Math.floor(r/10)]+GEM_U[r%10];const x=h+t;return x.length===1?x+'׳':x.slice(0,-1)+'״'+x.slice(-1)}
let HDF=null;try{HDF=new Intl.DateTimeFormat('he-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric'})}catch(e){}
function hparts(d){try{const o={};HDF.formatToParts(d).forEach(p=>o[p.type]=p.value);return o}catch(e){return null}}
const hebDay=d=>{const o=hparts(d);return o?gem(+o.day):''};
const hebFull=d=>{const o=hparts(d);return o?gem(+o.day)+' ב'+o.month+' '+gem(+o.year):''};
S.rec=[];
function recOn(k){const d=fromKey(k);return S.rec.filter(r=>{const s=fromKey(r.start);if(d<s)return false;if(r.rep==='weekly')return d.getDay()===s.getDay();if(r.rep==='monthly')return d.getDate()===s.getDate();if(r.rep==='yearly')return d.getDate()===s.getDate()&&d.getMonth()===s.getMonth();return false})}
const evTitles=k=>[...recOn(k).map(r=>r.t),...(getDay(k).events||[]).map(e=>e.t)];
const getDay=k=>S.days[k]||blank();
const isEmpty=d=>!d||(!d.journal&&!d.notes&&!(d.tasks||[]).length&&!(d.events||[]).length&&!d.marker&&!(d.reminder&&d.reminder.text)&&!d.mood&&!d.photo);
function editDay(k,fn){const d=JSON.parse(JSON.stringify(getDay(k)));fn(d);if(isEmpty(d))delete S.days[k];else S.days[k]=d;save(k)}

const timers={};
function save(k){
  try{localStorage.setItem('sy-days',JSON.stringify(S.days))}catch(e){}
  if(!S.col)return;
  clearTimeout(timers[k]);
  timers[k]=setTimeout(async()=>{
    const ref=S.col.doc('d'+k);
    try{ if(S.days[k]) await ref.set(S.days[k]); else await ref.delete(); setSync('נשמר בענן ✓') }
    catch(e){ setSync('השמירה לענן נכשלה – נשמר במכשיר') }
  },600);
}
const setSync=t=>document.getElementById('sync').textContent=t;

/* ---------- rendering ---------- */
function rangeDays(){
  if(S.view==='month'){
    const first=new Date(S.cursor.getFullYear(),S.cursor.getMonth(),1);
    const start=addDays(first,-first.getDay());
    const last=new Date(S.cursor.getFullYear(),S.cursor.getMonth()+1,0);
    const end=addDays(last,6-last.getDay());
    const out=[];for(let d=start;d<=end;d=addDays(d,1))out.push(d);return out;
  }
  if(S.view==='week'){const s=addDays(S.cursor,-S.cursor.getDay());return[...Array(7)].map((_,i)=>addDays(s,i))}
  return[...Array(3)].map((_,i)=>addDays(S.cursor,i));
}
function renderTitle(){
  const t=document.getElementById('title');const ds=rangeDays();
  if(S.view==='month')t.textContent=HE_MONTHS[S.cursor.getMonth()]+' '+S.cursor.getFullYear();
  else{const a=ds[0],b=ds[ds.length-1];t.textContent=a.getDate()+'.'+(a.getMonth()+1)+' – '+b.getDate()+'.'+(b.getMonth()+1)+'.'+String(b.getFullYear()).slice(2)}
  document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===S.view));
}
function icons(d){
  const out=[];const t=d.tasks||[];if(d.mood)out.push(d.mood);if(d.photo)out.push('📷');
  if(t.length)out.push('☑'+t.filter(x=>x.d).length+'/'+t.length);
  if(d.journal)out.push('✎');if(d.notes)out.push('🗒');if(d.reminder&&d.reminder.text)out.push('🔔');
  return out;
}
function renderCal(){
  const w=document.getElementById('calWrap');const ds=rangeDays();const tk=todayKey();
  if(S.view==='month'){
    const m=S.cursor.getMonth();
    w.innerHTML=`<div class="cal"><div class="dow">${HE_DOW.map(x=>`<div>${x}</div>`).join('')}</div><div class="grid">${ds.map(d=>{
      const k=keyOf(d),day=getDay(k),h=HOL[k]||[];
      const cls=['cell',d.getMonth()!==m?'out':'',k===tk?'today':'',k===S.sel?'sel':'',d.getDay()===6?'sat':'',h.some(x=>x.chag)?'chag':'',day.marker?'mk-'+day.marker:'',S.anchor===k?'anchor':''].join(' ');
      return `<button class="${cls}" data-k="${k}" aria-label="${d.getDate()} ${HE_MONTHS[d.getMonth()]}"><span class="top"><span class="num">${d.getDate()}</span><span class="heb">${hebDay(d)}</span></span>${h.slice(0,1).map(x=>`<span class="hol ${x.fun?'fun':''}">${esc(x.t)}</span>`).join('')}${evTitles(k).slice(0,1).map(t=>`<span class="ev">• ${esc(t)}</span>`).join('')}<span class="icons">${icons(day).map(x=>`<span>${x}</span>`).join('')}</span>${day.mood?`<span class="moodbar mood-${MOODS.indexOf(day.mood)+1}"></span>`:''}</button>`}).join('')}</div></div>`;
  }else{
    w.innerHTML=`<div class="list">${ds.map(d=>{
      const k=keyOf(d),day=getDay(k),h=HOL[k]||[];
      const lines=[];
      h.forEach(x=>lines.push(`<div class="line h ${x.fun?'fun':''}">${esc(x.t)}</div>`));
      evTitles(k).forEach(t=>lines.push(`<div class="line">• ${esc(t)}</div>`));
      if(day.reminder&&day.reminder.text)lines.push(`<div class="line">🔔 ${esc(day.reminder.time)} ${esc(day.reminder.text)}</div>`);
      if(day.journal)lines.push(`<div class="line m">✎ ${esc(day.journal.split('\n')[0])}</div>`);
      const ic=icons(day).filter(x=>x[0]==='☑');if(ic.length)lines.push(`<div class="line m">משימות ${ic[0].slice(1)}</div>`);
      if(!lines.length)lines.push(`<div class="line m">אין רישומים</div>`);
      return `<button class="drow ${k===S.sel?'sel':''} ${day.marker?'mk-'+day.marker:''} ${S.anchor===k?'anchor':''}" data-k="${k}"><div class="date">${d.getDate()}<small>${HE_DOW_FULL[d.getDay()]}${k===tk?' · היום':''}<br>${hebDay(d)} ${day.mood||''}</small></div>${lines.slice(0,5).join('')}</button>`}).join('')}</div>`;
  }
}
function renderBanners(){
  const b=document.getElementById('banners');const tk=todayKey();const out=[];
  [tk,keyOf(addDays(new Date(),1))].forEach((k,i)=>{const r=getDay(k).reminder;if(r&&r.text)out.push(`<div class="banner"><span>🔔</span><div><b>${i?'מחר':'היום'}${r.time?' ב־'+esc(r.time):''}:</b> ${esc(r.text)}</div></div>`)});
  b.innerHTML=out.join('');b.style.display=out.length?'flex':'none';b.style.flexDirection='column';b.style.gap='8px';
}
function renderDay(){
  const k=S.sel,d=getDay(k),date=fromKey(k),h=HOL[k]||[];
  const tasks=d.tasks||[],done=tasks.filter(t=>t.d).length,undone=tasks.length-done;
  const recs=recOn(k);
  document.getElementById('day').innerHTML=`
    <div class="day-head"><div><h3>יום ${HE_DOW_FULL[date.getDay()]}, ${date.getDate()} ב${HE_MONTHS[date.getMonth()]} ${date.getFullYear()}</h3><span class="small">${hebFull(date)}</span></div>
      <div class="day-markers"><span class="small">מרקר:</span>${MARKERS.map(([c,n])=>`<button class="swatch mk-${c}" data-daymark="${c}" aria-label="${n}" aria-pressed="${d.marker===c}"></button>`).join('')}<button class="swatch erase" data-daymark="" aria-label="בלי סימון" aria-pressed="${!d.marker}"></button></div></div>
    ${h.length?`<div class="tags">${h.map(x=>`<span class="tag ${x.fun?'fun':''}">${esc(x.t)}</span>`).join('')}</div>`:''}
    <section><h4><span>מצב רוח</span><span>${d.mood?MOOD_N[MOODS.indexOf(d.mood)]:''}</span></h4><div class="moods">${MOODS.map((m,i)=>`<button data-mood="${m}" aria-label="${MOOD_N[i]}" aria-pressed="${d.mood===m}">${m}</button>`).join('')}</div></section>
    <section><h4><span>יומן</span></h4><textarea id="f-journal" class="journal" placeholder="מה קרה היום? מה הרגשת?">${esc(d.journal||'')}</textarea></section>
    <section><h4><span>צ׳ק ליסט</span><span class="status">${tasks.length?`בוצעו ${done} מתוך ${tasks.length}`:''}</span></h4>
      <ul class="items">${tasks.map(t=>`<li class="${t.d?'done':''}"><input type="checkbox" id="t-${t.id}" data-task="${t.id}" ${t.d?'checked':''}><span>${esc(t.t)}</span><button class="del" data-deltask="${t.id}" aria-label="מחק משימה">×</button></li>`).join('')}</ul>
      <form class="add" id="addTask"><input id="f-task" placeholder="משימה חדשה…" autocomplete="off"><button>הוסף</button></form>
      ${undone?`<div class="gbar" style="margin-top:8px"><button class="pill" data-carry="1">העבר ${undone===1?'משימה אחת שלא בוצעה':undone+' משימות שלא בוצעו'} למחר ←</button></div>`:''}</section>
    ${S.ai?`<section class="ai"><label for="f-plan">✨ תכנן לי את היום</label><textarea id="f-plan" placeholder="למשל: יש לי לימודים עד 14:00, אימון, לקנות מתנה לאמא ולסדר את החדר">${esc(S.planQ||'')}</textarea><div class="gbar"><button class="pill primary" data-plan="1" ${S.planBusy?'disabled':''}>הוסף משימות לצ׳ק ליסט</button><span class="small">${esc(S.planMsg||'')}</span></div></section>`:''}
    <section><h4><span>אירועים</span></h4>
      <ul class="items">${recs.map(r=>`<li><span>↻ ${esc(r.t)} <span class="small">(${REP_N[r.rep]})</span></span><button class="del" data-delrec="${r.id}" aria-label="מחק אירוע חוזר">×</button></li>`).join('')}${(d.events||[]).map(e=>`<li><span>• ${esc(e.t)}</span><button class="del" data-delev="${e.id}" aria-label="מחק אירוע">×</button></li>`).join('')}</ul>
      <form class="add" id="addEv"><input id="f-ev" placeholder="יום הולדת, פגישה, טסט…" autocomplete="off"><select id="f-rep" aria-label="חזרה"><option value="">פעם אחת</option><option value="weekly">כל שבוע</option><option value="monthly">כל חודש</option><option value="yearly">כל שנה</option></select><button>הוסף</button></form></section>
    <section><h4><span>הערות</span></h4><textarea id="f-notes" placeholder="הערות ליום הזה">${esc(d.notes||'')}</textarea></section>
    ${S.assets||d.photo?`<section class="photo"><h4><span>תמונה של היום</span></h4>${d.photo?`<img data-pid="${esc(d.photo.id)}" alt="תמונה מ־${date.getDate()} ב${HE_MONTHS[date.getMonth()]}"><div class="gbar"><button class="pill warn" data-delphoto="1">הסר תמונה</button></div>`:`<label class="pill" for="f-photo">📷 הוסף תמונה</label><input type="file" id="f-photo" accept="image/*" hidden> <span class="small">${esc(S.photoMsg||'')}</span>`}</section>`:''}
    <section><h4><span>הודעה ליום הזה</span></h4>
      <div class="rem"><input type="time" id="f-rtime" value="${esc(d.reminder?.time||'')}"><input id="f-rtext" placeholder="מה להזכיר לך?" value="${esc(d.reminder?.text||'')}"></div>
      <p class="small" style="margin:6px 0 0">ההודעה מופיעה בראש היומן ביום הזה וביום שלפניו, ומסומנת ב־🔔 בלוח.</p></section>`;
}
function renderMarkUI(){
  document.getElementById('markMode').setAttribute('aria-pressed',S.mark);
  document.getElementById('rangeMode').hidden=!S.mark;document.getElementById('rangeMode').setAttribute('aria-pressed',S.range);
  const sw=document.getElementById('swatches');sw.hidden=!S.mark;
  sw.innerHTML=MARKERS.map(([c,n])=>`<button class="swatch mk-${c}" data-color="${c}" aria-label="${n}" aria-pressed="${S.color===c}"></button>`).join('')+`<button class="swatch erase" data-color="" aria-label="מחק סימון" aria-pressed="${S.color===''}"></button>`;
  const hint=document.getElementById('hint');hint.hidden=!S.mark;
  hint.textContent=S.range?(S.anchor?'עכשיו לחץ על היום האחרון בטווח':'לחץ על היום הראשון בטווח'):'לחץ על ימים כדי לסמן אותם במרקר';
}
function streak(test){let d=new Date();if(!test(getDay(keyOf(d))))d=addDays(d,-1);let n=0;while(n<3650&&test(getDay(keyOf(d)))){n++;d=addDays(d,-1)}return n}
function renderStats(){
  const j=streak(x=>!!(x.journal||'').trim()),p=streak(x=>(x.tasks||[]).length>0&&x.tasks.every(t=>t.d));
  const now=new Date(),pre=now.getFullYear()+'-'+pad(now.getMonth()+1);
  const m=Object.keys(S.days).filter(k=>k.startsWith(pre)).length;
  document.getElementById('stats').innerHTML=`<div class="stat"><b>🔥 ${j}</b><span>ימים ברצף שכתבת ביומן</span></div><div class="stat"><b>✅ ${p}</b><span>ימים ברצף שסגרת את כל המשימות</span></div><div class="stat"><b>📝 ${m}</b><span>ימים עם רישום החודש</span></div>`;
}
function renderUpcoming(){
  const out=[];const t0=new Date();
  for(let i=0;i<180&&out.length<6;i++){const k=keyOf(addDays(t0,i));evTitles(k).forEach(t=>out.push({k,t,i}))}
  const el=document.getElementById('upcoming');
  el.innerHTML=out.slice(0,6).map(x=>`<button class="upi" data-go="${x.k}"><b>${x.i===0?'היום':x.i===1?'מחר':'עוד '+x.i+' ימים'}</b><span>${esc(x.t)}</span></button>`).join('');
  el.hidden=!out.length;
}
function snippet(text,q){const i=text.toLowerCase().indexOf(q);const a=Math.max(0,i-30);const part=text.slice(a,i+q.length+50);const j=part.toLowerCase().indexOf(q);return(a>0?'…':'')+esc(part.slice(0,j))+'<mark>'+esc(part.slice(j,j+q.length))+'</mark>'+esc(part.slice(j+q.length))}
function renderResults(){
  const q=(S.q||'').trim().toLowerCase();const el=document.getElementById('results');
  if(q.length<2){el.innerHTML='';return}
  const res=[];
  Object.keys(S.days).sort().reverse().forEach(k=>{const d=S.days[k];const hay=[d.journal,d.notes,...(d.tasks||[]).map(t=>t.t),...(d.events||[]).map(e=>e.t),d.reminder&&d.reminder.text].filter(Boolean);const hit=hay.find(x=>x.toLowerCase().includes(q));if(hit)res.push({k,s:snippet(hit,q)})});
  S.rec.forEach(r=>{if(r.t.toLowerCase().includes(q))res.push({k:r.start,s:'↻ '+snippet(r.t,q)+' · '+REP_N[r.rep]})});
  (Object.entries(HOL)).forEach(([k,arr])=>arr.forEach(x=>{if(x.t.toLowerCase().includes(q)&&k>=todayKey())res.push({k,s:snippet(x.t,q)})}));
  el.innerHTML=res.length?res.slice(0,30).map(r=>{const d=fromKey(r.k);return `<button class="res" data-go="${r.k}"><b>${HE_DOW_FULL[d.getDay()]}, ${d.getDate()} ב${HE_MONTHS[d.getMonth()]} ${d.getFullYear()}</b><span>${r.s}</span></button>`}).join(''):`<div class="small">לא נמצא כלום עבור "${esc(S.q)}"</div>`;
}
function renderSum(){

async function runAI(mode){
  const q=(S.aiQ||'').trim();
  if(!q){S.aiMsg='כתוב קודם מה אתה רוצה בטבלה';renderTB();return}
  const t=S.tables[S.cur];const edit=mode==='edit'&&t;
  S.aiBusy=true;S.aiMsg='בונה את הטבלה…';renderTB();
  const prompt=`אתה עוזר שבונה טבלאות מסודרות בעברית בתוך יומן אישי.
בקשת המשתמש: ${q}
${edit?'זו הטבלה הנוכחית (JSON): '+JSON.stringify(t)+'\nעדכן אותה לפי הבקשה ושמור על מה שכבר מולא אלא אם התבקש אחרת.':'צור טבלה חדשה שמתאימה לבקשה.'}
כללים:
- החזר JSON בלבד בצורה {"name": string, "cols": string[], "rows": string[][]}. כל שורה באורך זהה למספר העמודות.
- עד 8 עמודות ועד 40 שורות. תאים קצרים וברורים. שם טבלה קצר.
- תוכנית אימונים: עמודות כמו יום, תרגיל, סטים, חזרות, מנוחה, ועמודה ריקה "בוצע ✓". התאם לרמה ולציוד שהמשתמש ציין.
- רשימת קניות: מיין לפי מחלקות בסופר (עמודת "מחלקה"), עמודת כמות, ועמודה ריקה "נקנה ✓".
- הרגלים: עמודת "הרגל", אפשר עמודת "למה", ועמודות ריקות לימי השבוע ראשון עד שבת.
- עמודה שמסמנים בה V (בוצע, נקנה, הושלם) תכיל ✓ בכותרת ותאים ריקים.
- לכל נושא אחר בחר את העמודות שהכי שימושיות.`;
  try{
    const r=await S.ai.json(prompt,{modelTier:'default',cache:false});
    if(!r||!Array.isArray(r.cols)||!Array.isArray(r.rows)||!r.cols.length)throw{code:'shape'};
    const cols=r.cols.slice(0,10).map(String);
    const rows=r.rows.slice(0,60).map(row=>cols.map((_,i)=>row&&row[i]!=null?String(row[i]):''));
    const tbl={name:String(r.name||'טבלה חדשה').slice(0,60),cols,rows};
    if(edit)S.tables[S.cur]=tbl;else{S.tables.push(tbl);S.cur=S.tables.length-1}
    S.aiMsg=edit?'הטבלה עודכנה ✓':'הטבלה נוצרה ✓ אפשר לערוך כל תא';S.aiQ='';saveExtra('tb');
  }catch(e){
    S.aiMsg=e&&e.code==='not_granted'?'מפתח ה־AI לא תקין. בדוק אותו ב־🔑 הגדרת AI':e&&e.code==='rate_limited'?'הגעת למכסה החינמית. נסה שוב בעוד דקה, או מחר':'לא הצלחתי לבנות טבלה. נסה לנסח את הבקשה אחרת';
  }
  S.aiBusy=false;renderTB();
}
async function runPlan(){
  const q=(S.planQ||'').trim();if(!q){S.planMsg='כתוב קודם מה יש לך היום';renderDay();return}
  const k=S.sel,date=fromKey(k),ex=(getDay(k).tasks||[]).map(t=>t.t);
  S.planBusy=true;S.planMsg='מתכנן…';renderDay();
  try{

מה שהוא כתב: ${q}
${ex.length?'משימות שכבר קיימות (אל תחזור עליהן): '+ex.join(', '):''}
החזר JSON בלבד בצורה {"tasks": string[]}: 3 עד 12 משימות קצרות ומעשיות בעברית, בסדר הגיוני לביצוע. כשזה עוזר, פתח משימה בשעה משוערת, למשל "16:00 – אימון". פרק משימות גדולות לצעדים קטנים.`,{modelTier:'default',cache:false});
    const list=(r&&Array.isArray(r.tasks)?r.tasks:[]).map(String).filter(Boolean).slice(0,15);

    editDay(k,d=>{d.tasks=d.tasks||[];list.forEach(t=>d.tasks.push({id:uid(),t,d:false}))});

  }catch(e){S.planMsg=e&&e.code==='not_granted'?'מפתח ה־AI לא תקין. בדוק אותו ב־🔑 הגדרת AI':e&&e.code==='rate_limited'?'הגעת למכסה החינמית. נסה שוב בעוד דקה, או מחר':'לא הצלחתי לתכנן. נסה לנסח אחרת'}
  S.planBusy=false;if(S.sel===k){renderDay()}refreshCal();
}
async function runSummary(){
  const ds=rangeDays().filter(d=>S.view!=='month'||d.getMonth()===S.cursor.getMonth());
  S.sumLabel=S.view==='month'?'של '+HE_MONTHS[S.cursor.getMonth()]:S.view==='week'?'של השבוע':'של 3 הימים';
  const lines=ds.map(d=>{const k=keyOf(d),x=getDay(k),parts=[];
    if(x.mood)parts.push('מצב רוח '+MOOD_N[MOODS.indexOf(x.mood)]);
    const t=x.tasks||[];if(t.length)parts.push(`משימות ${t.filter(y=>y.d).length}/${t.length}: `+t.map(y=>(y.d?'✓ ':'✗ ')+y.t).join(', '));
    const ev=evTitles(k);if(ev.length)parts.push('אירועים: '+ev.join(', '));
    if(x.journal)parts.push('יומן: '+x.journal.slice(0,600));if(x.notes)parts.push('הערות: '+x.notes.slice(0,300));
    return parts.length?`${HE_DOW_FULL[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}: `+parts.join(' | '):null}).filter(Boolean);
  if(!lines.length){S.sum='אין עדיין רישומים בתקופה הזו. כתוב ביומן, סמן משימות ומצב רוח, ואז אפשר לסכם.';renderSum();return}
  S.sum='חושב…';renderSum();

${lines.join('\n')}`,{cache:false,onText:({text})=>{S.sum=text;renderSum()}});

const GEMINI_MODELS=['gemini-3.8-flash','gemini-flash-latest','gemini-3.6-flash'];
function makeAI(key){
  async function gen(input,json){
    let lastErr={code:'error'};
    for(const m of GEMINI_MODELS){
      let r;
      try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',
        headers:{'content-type':'application/json','x-goog-api-key':key},
        body:JSON.stringify({contents:[{role:'user',parts:[{text:input}]}],generationConfig:Object.assign({temperature:.7,maxOutputTokens:4000},json?{responseMimeType:'application/json'}:{})})})}
      catch(e){throw{code:'network'}}
      if(r.status===404){lastErr={code:'error'};continue}
      if(r.status===429)throw{code:'rate_limited'};
      if(r.status===400||r.status===401||r.status===403){let msg='';try{msg=JSON.stringify(await r.json())}catch(e){}throw{code:/API_KEY|PERMISSION|key/i.test(msg)?'not_granted':'error'}}
      if(!r.ok)throw{code:'error'};
      const j=await r.json();
      return ((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(x=>x.text||'').join('');
    }
    throw lastErr;
  }
  async function call(input,opts={}){const text=await gen(input,false);if(opts.onText)opts.onText({text,delta:text});return{text}}
  call.json=async(input)=>{const text=await gen(input+'\n\nהחזר JSON תקין בלבד.',true);const m=text.match(/\{[\s\S]*\}/);if(!m)throw{code:'invalid_json'};return JSON.parse(m[0])};
  return call;
}
const IDB=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const q=indexedDB.open('super-yoman',1);q.onupgradeneeded=()=>q.result.createObjectStore('photos');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
  const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('photos',mode);const r=fn(t.objectStore('photos'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)}));
  return{put:(k,v)=>tx('readwrite',s=>s.put(v,k)),get:k=>tx('readonly',s=>s.get(k)),del:k=>tx('readwrite',s=>s.delete(k))}})();

async function cloudStart(col){

    else if(doc.id.startsWith('d'))remote[doc.id.slice(1)]=doc.data();
  });
  S.col=col;
  if(rTT)S.tt=rTT;else saveExtra('tt');
  if(rTB)S.tables=rTB;else if(S.tables.length)saveExtra('tb');
  if(rREC)S.rec=rREC;else if(S.rec.length)saveExtra('rec');
  const localOnly=Object.keys(S.days).filter(k=>!remote[k]);

  setSync('מסונכרן לענן ✓');

  unsubCloud=col.onSnapshot(sn=>{
    let changed=false;
    sn.docChanges().forEach(ch=>{
      if(ch.doc.metadata.hasPendingWrites)return;
      const id=ch.doc.id,gone=ch.type==='removed',data=gone?null:ch.doc.data();
      try{
        if(id==='s-timetable'&&data)S.tt=JSON.parse(data.json);
        else if(id==='s-tables'&&data)S.tables=JSON.parse(data.json);
        else if(id==='s-recurring'&&data)S.rec=JSON.parse(data.json);
        else if(id.startsWith('d')){const k=id.slice(1);if(gone)delete S.days[k];else S.days[k]=data}
        changed=true;
      }catch(e){}
    });
    if(changed){try{localStorage.setItem('sy-days',JSON.stringify(S.days));localStorage.setItem('sy-extra',JSON.stringify({tt:S.tt,tables:S.tables,rec:S.rec}))}catch(e){}safeRender()}
  },()=>setSync('אין חיבור לענן כרגע – נשמר במכשיר'));
}
